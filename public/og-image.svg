  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" text-anchor="middle">
    <text x="600" y="280" font-size="138" font-weight="700" fill="url(#title)" letter-spacing="-4">XeniOS</text>
    <text x="600" y="360" font-size="36" font-weight="500" fill="#a1a1aa">Xbox 360 emulator for iPhone, iPad &amp; Mac</text>
    <text x="600" y="510" font-size="22" font-weight="600" fill="#34d399" letter-spacing="6">FREE • OPEN SOURCE • COMMUNITY-DRIVEN</text>
  </g>
