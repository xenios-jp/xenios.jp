name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "COMPATIBILITY.md"
      - "data/compatibility.json"
      - "data/discussions.json"
      - "data/release-builds.json"
      - "data/builds-history.json"
      - "public/compatibility/data.json"
      - "public/compatibility/discussions.json"
      - "public/compatibility/search-index.json"
      - "public/builds/release-builds.json"
      - "public/builds/history.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
