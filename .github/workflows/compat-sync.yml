name: Sync Compatibility Table

on:
  workflow_dispatch:
  push:
    paths:
      - "data/compatibility.json"
      - "data/discussions.json"
      - "data/release-builds.json"
      - "data/builds-history.json"
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-table:
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Repair GitHub release artifact links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/repair-release-builds.mjs

      - name: Generate COMPATIBILITY.md
        run: node scripts/generate-compatibility-markdown.mjs

      - name: Sync public compatibility data
        run: node scripts/sync-public-compat-data.mjs

      - name: Stage mirrored public data
        id: stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/release-builds.json data/builds-history.json COMPATIBILITY.md public/compatibility/data.json public/compatibility/discussions.json public/compatibility/search-index.json public/builds/release-builds.json public/builds/history.json
          if ! git diff --staged --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          fi

      - name: Install dependencies
        if: steps.stage.outputs.changed == 'true'
        run: npm ci

      - name: Build site
        if: steps.stage.outputs.changed == 'true'
        run: npm run build:pages

      - name: Upload Pages artifact
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Commit mirrored public data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git commit -m "data: sync published site data [skip ci]"
          git push

  deploy:
    needs: generate-table
    if: needs.generate-table.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
